# AgentMRI audit gate — 에이전트 실행 trace를 PR에서 자동 감사한다.
# 사용법: 레포에 golden trace와 후보 trace를 커밋하고 아래 경로를 맞춘다.
name: agentmri-audit

on:
  pull_request:
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      # fixture 데모: 성공 trace는 통과하고, 미검증 외부 행동 trace는 게이트가 차단한다.
      # 실제 사용에서는 CI가 생성한 실행 trace를 candidate로 넘긴다.
      - name: audit golden sanity check
        run: npx tsx scripts/agentmri-audit.ts --baseline fixtures/successful-calendar.json --candidate fixtures/successful-calendar.json
      - name: audit must catch unverified external action
        run: |
          if npx tsx scripts/agentmri-audit.ts --candidate fixtures/unverified-external-action.json; then
            echo "게이트가 high severity finding을 놓쳤습니다" && exit 1
          else
            echo "게이트가 정상적으로 차단했습니다"
          fi

      # multi-run flakiness gate — 같은 task의 실행 N개를 묶어 불안정성을 판정한다.
      # 데모 fixture는 의도적으로 flaky(fail 1/4)라 엄격 기준에서는 차단되는 게 정상이다.
      - name: multi-run flakiness gate blocks flaky group
        run: |
          if npx tsx scripts/agentmri-audit.ts --runs fixtures/multirun/calendar; then
            echo "flaky 그룹을 놓쳤습니다" && exit 1
          else
            echo "flakiness 게이트가 정상적으로 차단했습니다"
          fi
      - name: multi-run gate passes with lenient thresholds
        run: npx tsx scripts/agentmri-audit.ts --runs fixtures/multirun/calendar --min-pass-rate 0.5 --max-flakiness 0.9 --min-pass-pow-k 0.1
